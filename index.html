    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Shipping Software for e-commerce &amp; Logistics | Zineps</title>
    <meta name="description" content="AI shipping software for eCommerce and logistics teams. Automate workflows, integrate carriers, reduce costs, and scale operations with Zineps." />
    <style>
      /* Clean white base preventing any flash */
      html, body {
        background-color: #ffffff;
        margin: 0;
        padding: 0;
      }
      #pre-react-curtain {
        position: fixed;
        inset: 0;
        z-index: 999999;
        pointer-events: none;
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        background: radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.72) 0%, rgba(240, 252, 249, 0.55) 60%, rgba(255, 255, 255, 0.75) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease;
      }
      .pre-curtain-circle {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1.5px solid rgba(112, 202, 185, 0.45);
        box-shadow: 0 16px 48px -4px rgba(15, 127, 117, 0.22), 0 2px 10px rgba(0, 0, 0, 0.03), inset 0 1px 2px rgba(255, 255, 255, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: preCirclePulse 2.2s ease-in-out infinite;
      }
      .pre-curtain-svg {
        width: 44px;
        height: 44px;
        display: block;
        color: #0f7f75;
        filter: drop-shadow(0 2px 8px rgba(15, 127, 117, 0.25));
      }
      @keyframes preCirclePulse {
        0%, 100% { transform: scale(1); opacity: 0.94; }
        50% { transform: scale(1.06); opacity: 1; box-shadow: 0 20px 56px -4px rgba(15, 127, 117, 0.32), inset 0 1px 2px rgba(255, 255, 255, 1); }
      }
    </style>
  </head>
